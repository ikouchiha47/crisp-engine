<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crisp Monitor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #f8f8f6;
  --bg-row:   #f2f2f0;
  --bg-panel: #ffffff;
  --ink:      #0d0d0d;
  --rule:     #d8d8d5;
  --muted:    #909090;
  --dim:      #c8c8c4;

  --hook:    #003cff;
  --match:   #006630;
  --skip:    #b8b8b4;
  --saved:   #005c5c;
  --embok:   #7a5500;
  --embfail: #b82000;
  --ref:     #5500bb;
  --alarm:   #ff2600;

  --mono: 'JetBrains Mono', monospace;
  --cond: 'Barlow Condensed', sans-serif;
}

html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: var(--mono); font-size: 12px; overflow: hidden; }

.shell { display: grid; grid-template-rows: auto auto auto auto 1fr; height: 100vh; }

/* ── Top bar ── */
.topbar {
  border-bottom: 1px solid var(--ink);
  display: flex; align-items: stretch;
  background: var(--bg-panel);
}
.tb-brand {
  padding: 10px 16px; border-right: 1px solid var(--ink);
  display: flex; align-items: center;
}
.tb-brand-name { font-family: var(--cond); font-weight: 700; font-size: 17px; letter-spacing: .02em; }
.tb-brand-name em { color: var(--hook); font-style: normal; }
.tb-session {
  padding: 10px 16px; border-right: 1px solid var(--rule);
  display: flex; flex-direction: column; justify-content: center; gap: 1px;
}
.tb-session-label { font-family: var(--cond); font-size: 9px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); }
.tb-session-val { font-size: 11px; font-weight: 500; }
.tb-watchers {
  padding: 10px 16px; display: flex; align-items: center; gap: 8px;
  border-right: 1px solid var(--rule);
}
.tb-watcher-label { font-family: var(--cond); font-size: 9px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.wpill {
  display: flex; align-items: center; gap: 4px;
  padding: 2px 7px; border: 1px solid var(--rule); background: var(--bg);
}
.wpill-dot { width: 5px; height: 5px; background: var(--match); flex-shrink: 0; }
.wpill-dot.off { background: var(--dim); }
.wpill-name { font-size: 10px; }
.wpill-name.off { color: var(--muted); }
.wpill-n { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 2px; }
.tb-live {
  margin-left: auto; padding: 10px 16px; border-left: 1px solid var(--rule);
  display: flex; align-items: center; gap: 6px;
}
.live-dot { width: 7px; height: 7px; background: var(--alarm); animation: blink 1.1s ease-in-out infinite; }
.live-dot.paused { background: var(--muted); animation: none; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.15} }
.live-text { font-family: var(--cond); font-weight: 600; font-size: 11px; letter-spacing: .1em; color: var(--alarm); }
.live-text.paused { color: var(--muted); }

/* ── Stats strip ── */
.statsstrip { border-bottom: 1px solid var(--ink); display: flex; align-items: stretch; background: var(--bg-panel); }
.stat { flex: 1; padding: 10px 20px; border-right: 1px solid var(--rule); display: flex; flex-direction: column; gap: 1px; }
.stat:last-child { border-right: none; }
.stat-label { font-family: var(--cond); font-size: 9px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.stat-num { font-family: var(--cond); font-weight: 700; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat-num.blue   { color: var(--hook); }
.stat-num.orange { color: var(--embok); }
.stat-num.violet { color: var(--ref); }
.stat-sub { font-size: 9px; color: var(--dim); font-variant-numeric: tabular-nums; }

/* ── Filter bar ── */
.filterbar {
  border-bottom: 1px solid var(--rule);
  display: flex; align-items: center; gap: 0;
  background: var(--bg-panel); height: 36px;
}
.filter-search {
  flex: 1; height: 100%;
  border: none; border-right: 1px solid var(--rule);
  background: transparent; outline: none;
  font-family: var(--mono); font-size: 11px; color: var(--ink);
  padding: 0 14px;
}
.filter-search::placeholder { color: var(--dim); }
.filter-search:focus { background: #fffff8; }

.time-range-group { display: flex; align-items: stretch; border-right: 1px solid var(--rule); }
.tr-btn {
  height: 100%; padding: 0 12px;
  border: none; border-right: 1px solid var(--rule); background: transparent;
  font-family: var(--cond); font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
  color: var(--muted); cursor: pointer;
}
.tr-btn:last-child { border-right: none; }
.tr-btn.active { background: var(--ink); color: var(--bg); }
.tr-btn:hover:not(.active) { background: var(--bg-row); }

.type-filter-group { display: flex; align-items: stretch; border-right: 1px solid var(--rule); }
.tf-btn {
  height: 100%; padding: 0 11px;
  border: none; border-right: 1px solid var(--rule); background: transparent;
  font-family: var(--cond); font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  cursor: pointer; color: var(--muted);
}
.tf-btn:last-child { border-right: none; }
.tf-btn.active { color: var(--bg-panel); }
.tf-btn.f-hook.active   { background: var(--hook); }
.tf-btn.f-match.active  { background: var(--match); }
.tf-btn.f-saved.active  { background: var(--saved); }
.tf-btn.f-embed.active  { background: var(--embok); }
.tf-btn.f-ref.active    { background: var(--ref); }

.pause-btn {
  height: 100%; padding: 0 14px;
  border: none; background: transparent;
  font-family: var(--cond); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  cursor: pointer; color: var(--muted);
}
.pause-btn:hover { background: var(--bg-row); color: var(--ink); }
.pause-btn.paused { color: var(--alarm); }

/* ── Body ── */
.body { display: grid; grid-template-columns: 148px 1fr 218px; overflow: hidden; }

/* ── Sidebar ── */
.sidebar { border-right: 1px solid var(--ink); background: var(--bg-panel); display: flex; flex-direction: column; overflow: hidden; }
.sb-head { padding: 10px 12px 6px; font-family: var(--cond); font-size: 9px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--rule); flex-shrink: 0; }
.sb-list { overflow-y: auto; flex: 1; }
.sb-list::-webkit-scrollbar { width: 3px; }
.sb-list::-webkit-scrollbar-thumb { background: var(--dim); }

/* project group header */
.proj-row { display: flex; align-items: center; padding: 6px 12px 4px; gap: 5px; border-bottom: 1px solid var(--rule); background: var(--bg-row); position: sticky; top: 0; z-index: 1; }
.proj-name { font-family: var(--cond); font-size: 11px; font-weight: 700; letter-spacing: .04em; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj-n { font-size: 9px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* session row under a project */
.sess-row { display: flex; align-items: center; padding: 5px 12px 5px 20px; gap: 5px; border-left: 2px solid transparent; border-bottom: 1px solid var(--rule); cursor: pointer; }
.sess-row:hover { background: var(--bg-row); }
.sess-row.active { border-left-color: var(--hook); background: #f0f4ff; }
.sess-row.active .sess-id { color: var(--hook); font-weight: 500; }
.sess-id { font-size: 10px; font-variant-numeric: tabular-nums; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sess-n { font-size: 9px; color: var(--muted); font-variant-numeric: tabular-nums; flex-shrink: 0; }

/* ── Feed ── */
.feed-col { display: flex; flex-direction: column; overflow: hidden; }
.feed-meta { border-bottom: 1px solid var(--rule); padding: 0 14px; height: 28px; display: flex; align-items: center; background: var(--bg-panel); }
.feed-count { font-size: 10px; color: var(--dim); font-variant-numeric: tabular-nums; }
.feed-showing { margin-left: 8px; font-size: 10px; color: var(--muted); }
.feed-no-results { padding: 24px 14px; font-size: 11px; color: var(--muted); font-family: var(--cond); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }

.feed { flex: 1; overflow-y: auto; background: var(--bg); }
.feed::-webkit-scrollbar { width: 3px; }
.feed::-webkit-scrollbar-thumb { background: var(--dim); }

.ev {
  display: flex; align-items: baseline;
  border-bottom: 1px solid var(--rule);
  border-left: 3px solid transparent;
  padding: 5px 0; gap: 0;
}
.ev.hidden { display: none; }
.ev:hover { background: var(--bg-row); }

/* per-type left stripe */
.ev.ev-hook    { border-left-color: var(--hook); }
.ev.ev-match   { border-left-color: var(--match); }
.ev.ev-skip    { border-left-color: var(--dim); }
.ev.ev-saved   { border-left-color: var(--saved); }
.ev.ev-embok   { border-left-color: var(--embok); }
.ev.ev-embfail { border-left-color: var(--embfail); }
.ev.ev-ref     { border-left-color: var(--ref); }
.ev-ts { font-size: 10px; color: var(--dim); padding: 0 10px; width: 72px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.ev-badge { font-family: var(--cond); font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; width: 148px; flex-shrink: 0; padding-right: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev-badge.hook    { color: var(--hook); }
.ev-badge.match   { color: var(--match); }
.ev-badge.skip    { color: var(--skip); }
.ev-badge.saved   { color: var(--saved); }
.ev-badge.embok   { color: var(--embok); }
.ev-badge.embfail { color: var(--embfail); }
.ev-badge.ref     { color: var(--ref); }
.ev-detail { font-size: 10px; color: var(--muted); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 14px; }
.ev-detail .hi  { color: var(--ink); }
.ev-detail .ok  { color: var(--match); }
.ev-detail .err { color: var(--embfail); }
.ev-detail .wrn { color: var(--embok); }
.ev-detail .lo  { color: var(--dim); }

/* search match highlight */
mark { background: #ffe066; color: var(--ink); border-radius: 1px; padding: 0 1px; }

/* ── View switcher ── */
.viewbar { display: flex; border-bottom: 1px solid var(--ink); background: var(--bg-panel); }
.view-btn { padding: 0 20px; height: 32px; border: none; border-right: 1px solid var(--rule); background: transparent; font-family: var(--cond); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; color: var(--muted); }
.view-btn.active { background: var(--ink); color: var(--bg); }
.view-btn:hover:not(.active) { background: var(--bg-row); color: var(--ink); }

/* ── Memory browser ── */
#mem-view { display: none; overflow: hidden; }
#mem-view.active { display: grid; grid-template-columns: 200px 1fr 320px; }
.mem-projects { border-right: 1px solid var(--ink); overflow-y: auto; background: var(--bg-panel); }
.mem-proj-row { padding: 8px 14px; border-bottom: 1px solid var(--rule); cursor: pointer; }
.mem-proj-row:hover { background: var(--bg-row); }
.mem-proj-row.active { border-left: 2px solid var(--hook); padding-left: 12px; }
.mem-proj-name { font-family: var(--cond); font-weight: 700; font-size: 12px; }
.mem-proj-stats { font-size: 9px; color: var(--muted); margin-top: 2px; display: flex; gap: 6px; }
.mem-lbadge { font-family: var(--cond); font-size: 9px; font-weight: 700; padding: 1px 4px; border: 1px solid currentColor; }
.mem-lbadge.l0 { color: var(--hook); } .mem-lbadge.l1 { color: var(--ref); } .mem-lbadge.l2 { color: var(--saved); } .mem-lbadge.l3 { color: var(--match); }

.mem-list-col { display: flex; flex-direction: column; overflow: hidden; }
.mem-layer-bar { display: flex; border-bottom: 1px solid var(--rule); background: var(--bg-panel); flex-shrink: 0; }
.mem-layer-btn { padding: 0 14px; height: 30px; border: none; border-right: 1px solid var(--rule); background: transparent; font-family: var(--cond); font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; color: var(--muted); }
.mem-layer-btn.active { color: var(--bg-panel); }
.mem-layer-btn.l-all.active { background: var(--ink); }
.mem-layer-btn.l-0.active  { background: var(--hook); }
.mem-layer-btn.l-1.active  { background: var(--ref); }
.mem-layer-btn.l-2.active  { background: var(--saved); }
.mem-layer-btn.l-3.active  { background: var(--match); }
.mem-ep-list { flex: 1; overflow-y: auto; }
.mem-ep-list::-webkit-scrollbar { width: 3px; }
.mem-ep-list::-webkit-scrollbar-thumb { background: var(--dim); }
.mem-ep-row { display: flex; align-items: baseline; gap: 0; padding: 5px 0; border-bottom: 1px solid var(--rule); border-left: 3px solid transparent; cursor: pointer; }
.mem-ep-row:hover { background: var(--bg-row); }
.mem-ep-row.active { background: #f0f4ff; }
.mem-ep-row.l0 { border-left-color: var(--hook); } .mem-ep-row.l1 { border-left-color: var(--ref); } .mem-ep-row.l2 { border-left-color: var(--saved); } .mem-ep-row.l3 { border-left-color: var(--match); }
.mem-ep-layer { width: 28px; flex-shrink: 0; text-align: center; font-family: var(--cond); font-size: 10px; font-weight: 700; color: var(--muted); }
.mem-ep-cat { font-family: var(--cond); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; width: 120px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mem-ep-cat.conversation { color: var(--hook); } .mem-ep-cat.git_commit,.mem-ep-cat.git_push { color: var(--match); } .mem-ep-cat.summary { color: var(--ref); } .mem-ep-cat.instinct { color: var(--saved); } .mem-ep-cat.arc { color: var(--embok); } .mem-ep-cat.code_element,.mem-ep-cat.code { color: var(--muted); } .mem-ep-cat.documentation { color: var(--ink); }
.mem-ep-id { font-size: 10px; color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 10px; }
.mem-ep-imp { font-size: 9px; width: 36px; flex-shrink: 0; text-align: right; padding-right: 8px; color: var(--dim); font-variant-numeric: tabular-nums; }

.mem-detail-col { border-left: 1px solid var(--ink); display: flex; flex-direction: column; overflow: hidden; background: var(--bg-panel); }
.mem-detail-head { border-bottom: 1px solid var(--rule); padding: 8px 14px; flex-shrink: 0; }
.mem-detail-id { font-family: var(--cond); font-weight: 700; font-size: 12px; word-break: break-all; }
.mem-detail-meta { margin-top: 4px; display: flex; gap: 10px; font-size: 9px; color: var(--muted); flex-wrap: wrap; }
.mem-detail-body { flex: 1; overflow-y: auto; padding: 12px 14px; font-size: 11px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; color: var(--ink); }
.mem-detail-body::-webkit-scrollbar { width: 3px; }
.mem-detail-body::-webkit-scrollbar-thumb { background: var(--dim); }
.mem-empty { padding: 24px 14px; font-size: 11px; color: var(--muted); font-family: var(--cond); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }

/* ── Scroll-to-bottom FAB ── */
#scroll-fab {
  position: fixed; bottom: 20px; right: 232px;
  width: 32px; height: 32px;
  background: var(--ink); color: var(--bg);
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; line-height: 1;
  opacity: 0; pointer-events: none;
  transition: opacity .15s;
  z-index: 100;
}
#scroll-fab.visible { opacity: 1; pointer-events: all; }
#scroll-fab:hover { background: var(--hook); }

/* ── Episodes ── */
.ep-col { border-left: 1px solid var(--ink); display: flex; flex-direction: column; overflow: hidden; background: var(--bg-panel); }
.ep-bar { border-bottom: 1px solid var(--rule); padding: 0 12px; height: 28px; display: flex; align-items: center; font-family: var(--cond); font-size: 9px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); flex-shrink: 0; }
.ep-list { flex: 1; overflow-y: auto; }
.ep-list::-webkit-scrollbar { width: 3px; }
.ep-list::-webkit-scrollbar-thumb { background: var(--dim); }
.ep-card { padding: 8px 12px; border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; gap: 4px; }
.ep-card:hover { background: var(--bg-row); }
.ep-top { display: flex; align-items: center; gap: 6px; }
.ep-tag { font-family: var(--cond); font-weight: 700; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; padding: 1px 5px; border: 1px solid currentColor; flex-shrink: 0; }
.ep-tag.l0 { color: var(--hook); }
.ep-tag.l1 { color: var(--ref); }
.ep-tag.l2 { color: var(--saved); }
.ep-tag.l3 { color: var(--match); }
.ep-cat { font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ep-meta { display: flex; gap: 8px; font-size: 9px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ep-imp { color: var(--embok); }
.ep-emb { color: var(--match); }
.ep-emb.no { color: var(--embfail); }
.ep-time { margin-left: auto; color: var(--dim); }
</style>
</head>
<body>
<div class="shell">

  <!-- Top bar -->
  <div class="topbar">
    <div class="tb-brand">
      <span class="tb-brand-name">CRISP<em>.</em>MONITOR</span>
    </div>
    <div class="tb-session">
      <span class="tb-session-label">Session</span>
      <span class="tb-session-val" id="session-label">connecting...</span>
    </div>
    <div class="tb-watchers">
      <span class="tb-watcher-label">Watchers</span>
      <div class="wpill"><div class="wpill-dot" id="wd-git"></div><span class="wpill-name">Git</span><span class="wpill-n" id="wn-git">0</span></div>
      <div class="wpill"><div class="wpill-dot" id="wd-file"></div><span class="wpill-name">FileChange</span><span class="wpill-n" id="wn-file">0</span></div>
      <div class="wpill"><div class="wpill-dot off" id="wd-bash"></div><span class="wpill-name off" id="wl-bash">Bash</span><span class="wpill-n" id="wn-bash">0</span></div>
    </div>
    <div class="tb-live">
      <div class="live-dot" id="live-dot"></div>
      <span class="live-text" id="live-text">LIVE</span>
    </div>
  </div>

  <!-- Stats strip -->
  <div class="statsstrip">
    <div class="stat">
      <span class="stat-label">Events / min</span>
      <span class="stat-num blue" id="s-epm">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">Episodes</span>
      <span class="stat-num" id="s-eps">0</span>
      <span class="stat-sub">this session</span>
    </div>
    <div class="stat">
      <span class="stat-label">Embed OK</span>
      <span class="stat-num orange" id="s-emb">--</span>
    </div>
    <div class="stat">
      <span class="stat-label">Total events</span>
      <span class="stat-num" id="s-tot">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">Agent</span>
      <span class="stat-num" style="font-size:22px;padding-top:4px" id="s-agent">--</span>
    </div>
  </div>

  <!-- View switcher -->
  <div class="viewbar">
    <button class="view-btn active" id="vb-live" onclick="switchView('live')">Live Feed</button>
    <button class="view-btn" id="vb-mem" onclick="switchView('memory')">Memory Store</button>
  </div>

  <!-- Filter bar -->
  <div class="filterbar" id="filterbar">
    <input class="filter-search" id="search" type="text" placeholder="filter events...  e.g. GitWatcher, embed_fail, huh">

    <div class="time-range-group">
      <button class="tr-btn active" data-range="0">All</button>
      <button class="tr-btn" data-range="60">1m</button>
      <button class="tr-btn" data-range="300">5m</button>
      <button class="tr-btn" data-range="900">15m</button>
      <button class="tr-btn" data-range="3600">1h</button>
    </div>

    <div class="type-filter-group">
      <button class="tf-btn f-hook  active" data-type="hook">hook</button>
      <button class="tf-btn f-match active" data-type="match">watcher</button>
      <button class="tf-btn f-saved active" data-type="saved">episode</button>
      <button class="tf-btn f-embed active" data-type="embed">embed</button>
      <button class="tf-btn f-ref   active" data-type="ref">reflect</button>
    </div>

    <button class="pause-btn" id="pause-btn">&#9646;&#9646; Pause</button>
  </div>

  <!-- Body -->
  <div class="body">

    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sb-head">Projects</div>
      <div class="sb-list" id="session-list"></div>
    </div>

    <!-- Feed -->
    <div class="feed-col">
      <div class="feed-meta">
        <span class="feed-count" id="feed-count">0 events</span>
        <span class="feed-showing" id="feed-showing"></span>
      </div>
      <div class="feed" id="feed">
        <div class="feed-no-results" id="no-results" style="display:none">No matching events</div>
      </div>
    </div>

    <!-- Episodes panel -->
    <div class="ep-col">
      <div class="ep-bar">Recent episodes</div>
      <div class="ep-list" id="ep-list"></div>
    </div>

  </div>

  <!-- Memory browser view (hidden by default) -->
  <div id="mem-view">
    <div class="mem-projects" id="mem-projects">
      <div class="mem-empty">Loading...</div>
    </div>
    <div class="mem-list-col">
      <div class="mem-layer-bar">
        <button class="mem-layer-btn l-all active" onclick="memSetLayer(null,this)">All</button>
        <button class="mem-layer-btn l-0" onclick="memSetLayer(0,this)">L0 raw</button>
        <button class="mem-layer-btn l-1" onclick="memSetLayer(1,this)">L1 summary</button>
        <button class="mem-layer-btn l-2" onclick="memSetLayer(2,this)">L2 instinct</button>
        <button class="mem-layer-btn l-3" onclick="memSetLayer(3,this)">L3 arc</button>
      </div>
      <div class="mem-ep-list" id="mem-ep-list">
        <div class="mem-empty">Select a project</div>
      </div>
    </div>
    <div class="mem-detail-col">
      <div class="mem-detail-head" id="mem-detail-head">
        <div class="mem-detail-id" id="mem-detail-id">—</div>
        <div class="mem-detail-meta" id="mem-detail-meta"></div>
      </div>
      <div class="mem-detail-body" id="mem-detail-body">Select an episode to read its full content.</div>
    </div>
  </div>

</div>

<button id="scroll-fab" title="Jump to latest">&#8595;</button>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let paused = false;
let searchText = '';
let activeRange = 0;        // seconds; 0 = all
let activeTypes = new Set(['hook','match','saved','embed','ref']);
let lastEventId = 0;
let pollInterval = null;

let totalEv = 0, totalEps = 0, embedOk = 0, embedTotal = 0;
let wGit = 0, wFile = 0, wBash = 0;
const epmWin = [];

// Map type-filter key -> badge classes
const typeToClasses = {
  hook:  ['hook'],
  match: ['match','skip'],
  saved: ['saved'],
  embed: ['embok','embfail'],
  ref:   ['ref'],
};
const badgeToType = {};
for (const [t, classes] of Object.entries(typeToClasses))
  classes.forEach(c => { badgeToType[c] = t; });

// ── Polling ────────────────────────────────────────────────────────────────
async function poll() {
  if (paused) return;
  try {
    const res = await fetch(`/api/events?since=${lastEventId}&limit=100`);
    if (!res.ok) return;
    const events = await res.json();
    events.forEach(e => ingestEvent(e));
  } catch (_) {}
}

// ── Ingest a single event from the server ─────────────────────────────────
function ingestEvent(e) {
  if (e.id > lastEventId) lastEventId = e.id;
  totalEv++;
  epmWin.push(Date.now());

  const p = e.payload || {};
  updateStats(e, p);
  updateWatchers(e, p);
  addRow(e, p);
  updateSessionList(e.session || p.session_id || p.session, e.project || p.project);
}

function updateStats(e, p) {
  document.getElementById('s-tot').textContent = totalEv;
  if (e.event === 'episode_saved') {
    totalEps++;
    document.getElementById('s-eps').textContent = totalEps;
  }
  if (e.event === 'embed_result') {
    embedTotal++;
    if (p.success) { embedOk++; }
    document.getElementById('s-emb').textContent = Math.round(embedOk/embedTotal*100)+'%';
  }
  if (e.agent || p.agent) document.getElementById('s-agent').textContent = e.agent || p.agent;
  if (e.session || p.session_id) {
    document.getElementById('session-label').textContent =
      (p.project || e.project || '?') + ' / ' + (e.session || p.session_id || '?').slice(0,7);
  }
  // epm
  const now = Date.now();
  while (epmWin.length && epmWin[0] < now - 60000) epmWin.shift();
  document.getElementById('s-epm').textContent = epmWin.length;
}

function updateWatchers(e, p) {
  if (e.event !== 'watcher_matched') return;
  const n = (p.watcher_name || '').toLowerCase();
  if (n.includes('git'))  { wGit++;  document.getElementById('wn-git').textContent  = wGit; }
  if (n.includes('file')) { wFile++; document.getElementById('wn-file').textContent = wFile; }
  if (n.includes('bash')) { wBash++; document.getElementById('wn-bash').textContent = wBash; wBashActive(); }
}
function wBashActive() {
  document.getElementById('wd-bash').classList.remove('off');
  document.getElementById('wl-bash').classList.remove('off');
}

// projects[dir] = { fullPath, sessions:{sid->{count,el}}, el, sessContainer }
// sidToDir[sid] = dir  — a session belongs to exactly one project group
const projects = {};
const sidToDir = {};
let activeSid = null;
let filterSid = null;  // null = show all

function bestDir(path) {
  // returns the dir name only for real absolute paths; null for '-', null, short IDs
  if (!path || path === '-' || path === 'null') return null;
  if (!path.startsWith('/')) return null;  // not a real path
  return path.split('/').filter(Boolean).pop();
}

function ensureProject(dir, fullPath) {
  if (projects[dir]) return;
  projects[dir] = { fullPath, sessions: {}, el: null, sessContainer: null };
  const pEl = document.createElement('div');
  pEl.className = 'proj-row';
  pEl.title = fullPath || dir;
  const sContainer = document.createElement('div');
  projects[dir].el = pEl;
  projects[dir].sessContainer = sContainer;
  const list = document.getElementById('session-list');
  list.appendChild(pEl);
  list.appendChild(sContainer);
}

function updateSessionList(sid, project) {
  if (!sid) return;
  const dir = bestDir(project);
  const fullPath = dir ? project : null;

  // if we already know this session, try to upgrade its project if we got a better path
  if (sidToDir[sid]) {
    const existingDir = sidToDir[sid];
    if (dir && dir !== existingDir) {
      // better path found: move session row to correct group
      const oldProj = projects[existingDir];
      const sData = oldProj && oldProj.sessions[sid];
      if (sData) {
        ensureProject(dir, fullPath);
        const newProj = projects[dir];
        newProj.sessions[sid] = sData;
        newProj.sessContainer.appendChild(sData.el);
        delete oldProj.sessions[sid];
        sidToDir[sid] = dir;
        // clean up empty old group
        if (Object.keys(oldProj.sessions).length === 0) {
          oldProj.el.remove(); oldProj.sessContainer.remove();
          delete projects[existingDir];
        }
      }
    }
    // count the event
    const curDir = sidToDir[sid];
    const proj = projects[curDir];
    if (proj && proj.sessions[sid]) {
      proj.sessions[sid].count++;
      proj.sessions[sid].el.innerHTML = `<span class="sess-id">${esc(sid.slice(0,8))}</span><span class="sess-n">${proj.sessions[sid].count}</span>`;
      const nSess = Object.keys(proj.sessions).length;
      proj.el.innerHTML = `<span class="proj-name">${esc(curDir)}</span><span class="proj-n">${nSess}</span>`;
    }
    return;
  }

  // first time seeing this session — assign to best dir we have, or a fallback
  const assignDir = dir || 'unknown';
  const assignPath = fullPath || null;
  ensureProject(assignDir, assignPath);
  sidToDir[sid] = assignDir;

  const proj = projects[assignDir];
  const sEl = document.createElement('div');
  sEl.className = 'sess-row' + (!activeSid ? ' active' : '');
  if (!activeSid) { activeSid = sid; }
  sEl.dataset.sid = sid;
  sEl.addEventListener('click', () => filterBySid(sid));
  proj.sessions[sid] = { count: 1, el: sEl };
  proj.sessContainer.appendChild(sEl);

  sEl.innerHTML = `<span class="sess-id">${esc(sid.slice(0,8))}</span><span class="sess-n">1</span>`;
  const nSess = Object.keys(proj.sessions).length;
  proj.el.innerHTML = `<span class="proj-name">${esc(assignDir)}</span><span class="proj-n">${nSess}</span>`;
}

function filterBySid(sid) {
  filterSid = sid;
  activeSid = sid;
  document.querySelectorAll('.sess-row').forEach(r => r.classList.toggle('active', r.dataset.sid === sid));
  applyAllFilters();
}

// ── Badge class from event name ────────────────────────────────────────────
function eventBadge(name) {
  const n = name || '';
  if (n === 'hook_fired')       return ['hook', 'hook_fired'];
  if (n === 'watcher_matched')  return ['match', 'watcher_match'];
  if (n === 'watcher_skipped')  return ['skip', 'watcher_skip'];
  if (n === 'episode_saved')    return ['saved', 'episode_saved'];
  if (n === 'embed_result')     return ['embok', 'embed_ok'];  // overridden below
  if (n === 'reflect_ran')      return ['ref', 'reflect_ran'];
  return ['skip', n];
}

function buildDetail(e, p) {
  const parts = [];
  const ev = e.event || '';

  if (ev === 'hook_fired') {
    // pre_tool Edit  /  post_tool Bash  — action is the key thing
    if (p.tool_name)  parts.push(`<span class="hi">${esc(p.tool_name)}</span>`);
    if (p.event_type) parts.push(`<span class="lo">${esc(p.event_type)}</span>`);
    if (p.agent)      parts.push(esc(p.agent));

  } else if (ev === 'watcher_matched' || ev === 'watcher_skipped') {
    if (p.watcher_name) parts.push(`<span class="hi">${esc(p.watcher_name)}</span>`);
    if (p.episode_count !== undefined) parts.push(`${p.episode_count} ep`);

  } else if (ev === 'episode_saved') {
    // show category + short id
    if (p.category)  parts.push(`<span class="hi">${esc(p.category)}</span>`);
    if (p.id)        parts.push(`<span class="lo">${esc(p.id)}</span>`);
    if (p.layer !== undefined) parts.push(`L${p.layer}`);
    if (p.importance) parts.push(`imp <span class="wrn">${p.importance}</span>`);
    if (p.embedded === false) parts.push('<span class="wrn">not embedded</span>');

  } else if (ev === 'embed_result') {
    if (p.provider)      parts.push(`<span class="hi">${esc(p.provider)}</span>`);
    if (p.success === true)  parts.push('<span class="ok">OK</span>');
    if (p.success === false) parts.push('<span class="err">FAIL</span>');
    if (p.fallback_used) parts.push('<span class="wrn">fallback</span>');

  } else if (ev === 'reflect_ran') {
    if (p.l0_in !== undefined) parts.push(`in <span class="hi">${p.l0_in}</span>`);
    if (p.l1_created) parts.push(`l1+${p.l1_created}`);
    if (p.l2_created) parts.push(`l2+${p.l2_created}`);
    if (p.l3_created) parts.push(`l3+${p.l3_created}`);

  } else {
    // fallback: dump everything useful
    if (p.event_type)   parts.push(esc(p.event_type));
    if (p.tool_name)    parts.push(esc(p.tool_name));
    if (p.id)           parts.push(esc(p.id));
  }

  return parts.join(' · ');
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Add a row to the DOM ───────────────────────────────────────────────────
function addRow(e, p) {
  let [cls, label] = eventBadge(e.event);
  if (e.event === 'embed_result' && p.success === false) cls = 'embfail';
  if (e.event === 'embed_result' && p.success === false) label = 'embed_fail';

  const typeKey = badgeToType[cls] || 'hook';
  const tsMs = new Date(e.ts).getTime();
  const detail = buildDetail(e, p);
  const rawText = `${label} ${detail}`.replace(/<[^>]+>/g,' ');

  const row = document.createElement('div');
  row.className = `ev ev-${cls}`;
  row.dataset.type = typeKey;
  row.dataset.ts = tsMs;
  row.dataset.raw = rawText.toLowerCase();
  row.dataset.session = e.session || p.session_id || '';
  row.innerHTML = `<span class="ev-ts">${fmtTs(e.ts)}</span><span class="ev-badge ${cls}">${label}</span><span class="ev-detail">${detail}</span>`;

  document.getElementById('feed').insertBefore(row, document.getElementById('no-results'));
  applyFilter(row);
  updateFilterCount();
  autoScroll();
}

function fmtTs(iso) {
  try { return new Date(iso).toLocaleTimeString('en-GB', {hour12:false}); }
  catch(_) { return iso || '--'; }
}

// ── Filtering ──────────────────────────────────────────────────────────────
function applyFilter(row) {
  const ts = parseInt(row.dataset.ts, 10);
  const type = row.dataset.type;
  const raw = row.dataset.raw;
  const now = Date.now();

  const inRange  = activeRange === 0 || (now - ts) <= activeRange * 1000;
  const inType   = activeTypes.has(type);
  const inSearch = !searchText || raw.includes(searchText);
  const inSid    = !filterSid || !row.dataset.session || row.dataset.session === filterSid;

  row.classList.toggle('hidden', !(inRange && inType && inSearch && inSid));
}

function applyAllFilters() {
  document.querySelectorAll('#feed .ev').forEach(applyFilter);
  updateFilterCount();
  autoScroll();
}

function updateFilterCount() {
  const total = document.querySelectorAll('#feed .ev').length;
  const shown = document.querySelectorAll('#feed .ev:not(.hidden)').length;
  document.getElementById('feed-count').textContent = total + ' events';
  document.getElementById('feed-showing').textContent =
    shown < total ? `(showing ${shown})` : '';
  document.getElementById('no-results').style.display = shown === 0 ? 'block' : 'none';
}

function autoScroll() {
  if (paused) return;
  const f = document.getElementById('feed');
  f.scrollTop = f.scrollHeight;
}

// ── UI controls ───────────────────────────────────────────────────────────
document.getElementById('search').addEventListener('input', function() {
  searchText = this.value.trim().toLowerCase();
  applyAllFilters();
});

document.querySelectorAll('.tr-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.tr-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    activeRange = parseInt(this.dataset.range, 10);
    applyAllFilters();
  });
});

document.querySelectorAll('.tf-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    const t = this.dataset.type;
    if (activeTypes.has(t)) {
      if (activeTypes.size === 1) return; // keep at least one
      activeTypes.delete(t);
      this.classList.remove('active');
    } else {
      activeTypes.add(t);
      this.classList.add('active');
    }
    applyAllFilters();
  });
});

const pauseBtn = document.getElementById('pause-btn');
pauseBtn.addEventListener('click', function() {
  paused = !paused;
  this.textContent = paused ? '▶ Resume' : '❚❚ Pause';
  this.classList.toggle('paused', paused);
  document.getElementById('live-dot').classList.toggle('paused', paused);
  document.getElementById('live-text').textContent = paused ? 'PAUSED' : 'LIVE';
  document.getElementById('live-text').classList.toggle('paused', paused);
  if (!paused) autoScroll();
});

// ── Scroll-to-bottom FAB ──────────────────────────────────────────────────
const fab = document.getElementById('scroll-fab');
const feedEl = document.getElementById('feed');

feedEl.addEventListener('scroll', function() {
  const atBottom = feedEl.scrollHeight - feedEl.scrollTop - feedEl.clientHeight < 40;
  fab.classList.toggle('visible', !atBottom);
});

fab.addEventListener('click', function() {
  feedEl.scrollTop = feedEl.scrollHeight;
  fab.classList.remove('visible');
});

// ── View switching ────────────────────────────────────────────────────────
function switchView(view) {
  const liveBody = document.querySelector('.body');
  const memView  = document.getElementById('mem-view');
  const filterbar = document.getElementById('filterbar');
  document.getElementById('vb-live').classList.toggle('active', view === 'live');
  document.getElementById('vb-mem').classList.toggle('active', view === 'memory');
  liveBody.style.display  = view === 'live'   ? '' : 'none';
  filterbar.style.display = view === 'live'   ? '' : 'none';
  memView.classList.toggle('active', view === 'memory');
  if (view === 'memory') memLoadProjects();
}

// ── Memory browser ────────────────────────────────────────────────────────
let memActiveProjId = null;
let memActiveLayer  = null;

async function memLoadProjects() {
  try {
    const res = await fetch('/api/projects');
    const list = await res.json();
    const el = document.getElementById('mem-projects');
    el.innerHTML = '';
    list.forEach(p => {
      const row = document.createElement('div');
      row.className = 'mem-proj-row';
      row.dataset.projId = p.proj_id;
      const layers = Object.entries(p.layers).map(([l,n]) =>
        `<span class="mem-lbadge ${l}">${l.toUpperCase()} ${n}</span>`).join(' ');
      row.innerHTML = `<div class="mem-proj-name">${esc(p.name)}</div><div class="mem-proj-stats">${layers}</div>`;
      row.addEventListener('click', () => { memActiveProjId = p.proj_id; memLoadEpisodes(); document.querySelectorAll('.mem-proj-row').forEach(r=>r.classList.remove('active')); row.classList.add('active'); });
      el.appendChild(row);
    });
    if (list.length && !memActiveProjId) {
      el.firstChild.click();
    }
  } catch(e) { console.error(e); }
}

function memSetLayer(layer, btn) {
  memActiveLayer = layer;
  document.querySelectorAll('.mem-layer-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  memLoadEpisodes();
}

async function memLoadEpisodes() {
  if (!memActiveProjId) return;
  let url = `/api/episodes/${memActiveProjId}?limit=500`;
  if (memActiveLayer !== null) url += `&layer=${memActiveLayer}`;
  try {
    const res = await fetch(url);
    const eps = await res.json();
    const el = document.getElementById('mem-ep-list');
    el.innerHTML = '';
    if (!eps.length) { el.innerHTML = '<div class="mem-empty">No episodes</div>'; return; }
    eps.reverse().forEach(ep => {
      const row = document.createElement('div');
      row.className = `mem-ep-row l${ep.layer}`;
      row.innerHTML = `<span class="mem-ep-layer">L${ep.layer}</span><span class="mem-ep-cat ${ep.category}">${esc(ep.category)}</span><span class="mem-ep-id">${esc(ep.id)}</span><span class="mem-ep-imp">${ep.importance}</span>`;
      row.addEventListener('click', () => { document.querySelectorAll('.mem-ep-row').forEach(r=>r.classList.remove('active')); row.classList.add('active'); memLoadDetail(ep.id); });
      el.appendChild(row);
    });
  } catch(e) { console.error(e); }
}

async function memLoadDetail(epId) {
  try {
    const res = await fetch(`/api/episode/${memActiveProjId}/${epId}`);
    const ep = await res.json();
    document.getElementById('mem-detail-id').textContent = ep.id;
    document.getElementById('mem-detail-meta').innerHTML = [
      `L${ep.layer}`, ep.category,
      `imp ${ep.importance}`,
      ep.embedded ? '<span style="color:var(--match)">embedded</span>' : '<span style="color:var(--embfail)">not embedded</span>',
      ep.session_id ? `sess ${ep.session_id.slice(0,8)}` : '',
      ep.created_at ? ep.created_at.slice(0,16).replace('T',' ') : '',
      (ep.tags||[]).join(' '),
    ].filter(Boolean).map(s=>`<span>${s}</span>`).join('');
    document.getElementById('mem-detail-body').textContent = ep.content || '(no content)';
  } catch(e) { console.error(e); }
}

// ── Start polling ──────────────────────────────────────────────────────────
pollInterval = setInterval(poll, 500);
poll();
</script>
</body>
</html>
