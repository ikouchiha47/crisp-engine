[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
# unlib/ holds orphaned modules pending a keep-or-delete decision (see
# plans/PRODUCT-personas-and-feature-audit.md) — their imports aren't fixed
# up after the code_index/store/consolidate restructuring and shouldn't
# block collection of the real suite.
norecursedirs = ["unlib", ".venv", ".git"]

[project]
name = "crisp-engine-memory"
version = "1.0.0"
description = "Episodic memory system for AI agents — SOLID, storage-agnostic, PageIndex-inspired"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "tree-sitter-python>=0.23.6",
    "tree-sitter>=0.23.2",
    "tree-sitter-javascript>=0.23.1",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-go>=0.23.4",
    "tree-sitter-c>=0.23.6",
    "tree-sitter-cpp>=0.23.4",
    "vadersentiment>=3.3.2",
    "tree-sitter-language-pack>=0.9.1",
]

[project.optional-dependencies]
dev = [
    "black>=23.0",
    "isort>=5.0",
    "pytest>=7.0",
]
full = [
    "pillow>=10.0",      # for image indexing
    "mutagen>=1.47",     # for audio metadata
]
semantic = [
    "sentence-transformers>=3.0",   # HuggingFace local embeddings (BAAI/bge-small-en-v1.5)
    "sqlite-vec>=0.1.6",            # ANN vector search via SQLite extension
    "dspy>=2.5",                    # configurable LM/embedding backend
    "gensim>=4.3",                  # word2vec averaged-vector fallback (glove-wiki-gigaword-50)
]
# Optional: tree-sitter for enhanced code analysis (install manually if needed)
# tree-sitter==0.20.0
# tree-sitter-python==0.20.0
# tree-sitter-javascript==0.20.0
# tree-sitter-typescript==0.20.0
# tree-sitter-go==0.20.0
# tree-sitter-rust==0.20.0
# tree-sitter-java==0.20.0

[project.scripts]
crisp-hook  = "lib.hooks:main"
crisp       = "lib.cli:main"

[tool.setuptools]
packages = ["lib", "lib.indexers", "lib.ingest"]

[dependency-groups]
dev = [
    "pytest-bdd>=8.1.0",
]
